<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestor de Gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Cargamos Tesseract.js para el OCR local -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{
  --bg:#E7ECF1; --paper:#FBFCFD; --ink:#16243B; --muted:#5E6B7E; --line:#CBD4DE;
  --violet:#4636C9; --violet-soft:#E4E1FA; --danger:#B42318;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1726; --paper:#18233A; --ink:#E6EBF3; --muted:#9AA7BB; --line:#2C3A55;
    --violet:#9C90FF; --violet-soft:#272459; --danger:#FF8A80;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1726; --paper:#18233A; --ink:#E6EBF3; --muted:#9AA7BB; --line:#2C3A55;
  --violet:#9C90FF; --violet-soft:#272459; --danger:#FF8A80;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 20px}
h1{font-size:1.75rem;line-height:1.1;margin:0;letter-spacing:-.02em;font-weight:700}
.month{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.month input{font:inherit;font-size:.9rem;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.total-line{font-size:.95rem;color:var(--muted)}
.total-line strong{color:var(--ink);font-size:1.15rem;font-variant-numeric:tabular-nums}

.slot{position:relative;background:var(--paper);border-radius:4px 4px 0 0;padding:28px 20px 34px;text-align:center;
  --tooth:10px;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - var(--tooth)) no-repeat,
    conic-gradient(from 135deg at 50% 0,#000 90deg,#0000 0) bottom/calc(var(--tooth)*2) var(--tooth) repeat-x;
          mask:linear-gradient(#000 0 0) top/100% calc(100% - var(--tooth)) no-repeat,
    conic-gradient(from 135deg at 50% 0,#000 90deg,#0000 0) bottom/calc(var(--tooth)*2) var(--tooth) repeat-x;
}
.slot h2{font-size:1.2rem;margin:0 0 4px;font-weight:600}
.slot p{margin:0 0 18px;color:var(--muted);font-size:.95rem}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;font-size:.95rem;border:0;border-radius:999px;padding:12px 20px;cursor:pointer;background:var(--violet);color:#fff;min-height:44px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 14px;min-height:36px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--violet);outline-offset:2px}

.status{margin-top:16px;font-size:.92rem;color:var(--muted);min-height:1.5em}
.status.err{color:var(--danger)}

.sesion{margin-top:22px;background:var(--paper);border-radius:12px;padding:18px;border:2px solid var(--violet)}
.sesion h2{margin:0;font-size:1.1rem}
.sesion .info{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.sesion .info strong{color:var(--ink);font-variant-numeric:tabular-nums}
ul.cola{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--line)}
ul.cola li{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
ul.cola img,ul.cola .ph{width:40px;height:52px;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:var(--bg)}
ul.cola .t{min-width:0}
ul.cola .t .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
ul.cola .t .s{font-size:.82rem;color:var(--muted)}
ul.cola .right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sesion .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}

.review{margin-top:22px;background:var(--paper);border-radius:12px;padding:18px;border:1px solid var(--line)}
.review-top{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start}
.thumb{width:96px;height:128px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--bg)}
.review h3{margin:0 0 2px;font-size:1.05rem}
.review .hint{margin:0;color:var(--muted);font-size:.88rem}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.fields .full{grid-column:1/-1}
label.field-lbl{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:44px}
textarea{min-height:64px;resize:vertical}
.amount{font-variant-numeric:tabular-nums;font-weight:600}
details.lines{margin-top:14px}
details.lines summary{cursor:pointer;font-size:.9rem;color:var(--violet);font-weight:600;padding:6px 0}
.receipt{font-family:var(--mono);font-size:.82rem;line-height:1.55;background:var(--bg);border-radius:6px;padding:12px;margin-top:8px;overflow-x:auto}
.receipt .r{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}
.receipt .r:last-child{border-bottom:0}
.receipt select{font-family:var(--sans);font-size:.8rem;min-height:32px;padding:4px 6px;width:auto;background:var(--paper)}
.receipt .imp{white-space:nowrap;text-align:right}
.review .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}

.section{margin-top:32px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.section-head h2{font-size:1.1rem;margin:0}
.cats{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.cat{display:grid;grid-template-columns:110px 1fr 76px;gap:10px;align-items:center;font-size:.88rem}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--violet);border-radius:4px}
.cat .v{text-align:right;font-variant-numeric:tabular-nums}
ul.gastos{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ul.gastos li{display:grid;grid-template-columns:52px 1fr auto auto;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.day{font-family:var(--mono);font-size:.8rem;color:var(--muted);line-height:1.2}
.day b{display:block;font-size:1.1rem;color:var(--ink);font-weight:500}
.who{min-width:0;background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.who:hover .n{text-decoration:underline}
.who .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .c{font-size:.82rem;color:var(--muted)}
.eur{font-variant-numeric:tabular-nums;font-weight:600}
.del{background:none;border:0;color:var(--muted);font-size:1.2rem;cursor:pointer;width:36px;height:36px;border-radius:50%}
.del:hover{color:var(--danger);background:var(--bg)}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.foot{margin-top:28px;font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Gestor de Gastos</h1>
    <div class="month">
      <input type="month" id="mes" aria-label="Mes">
      <div class="total-line">Total <strong id="totalMes">0,00 €</strong></div>
    </div>
  </header>

  <section class="slot" aria-labelledby="slotTitle">
    <h2 id="slotTitle">Añade tus tickets</h2>
    <p id="slotText">Haz una foto o sube tus imágenes para registrar tus tickets y generar el Excel.</p>
    <div class="btns">
      <label class="btn" for="fileCam" style="cursor:pointer">Hacer foto</label>
      <input type="file" id="fileCam" accept="image/*" capture="environment" style="display:none;">

      <label class="btn ghost" for="fileUp" style="cursor:pointer">Subir imágenes</label>
      <input type="file" id="fileUp" accept="image/jpeg,image/png,image/webp,image/gif" multiple style="display:none;">

      <button class="btn ghost" id="btnManual">Escribir a mano</button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </section>

  <section class="sesion hidden" id="sesion" aria-labelledby="sesTitle">
    <h2 id="sesTitle">Sesión en curso</h2>
    <p class="info" id="sesInfo"></p>
    <ul class="cola" id="cola"></ul>
    <div class="actions">
      <button class="btn ghost" id="btnCerrarSes">Cerrar sin Excel</button>
      <button class="btn" id="btnXlsxSes">Terminar y generar Excel</button>
    </div>
  </section>

  <section class="review hidden" id="review" aria-label="Revisar ticket">
    <div class="review-top">
      <img class="thumb" id="thumb" alt="Foto del ticket">
      <div>
        <h3>Datos del ticket</h3>
        <p class="hint" id="reviewHint">Revisa los datos extraídos automáticamente.</p>
      </div>
    </div>
    <div class="fields">
      <label class="field-lbl full">Comercio<input id="fComercio" autocomplete="off"></label>
      <label class="field-lbl">Fecha<input type="date" id="fFecha"></label>
      <label class="field-lbl">Total (€)<input id="fTotal" class="amount" inputmode="decimal"></label>
      <label class="field-lbl">IVA incluido (€)<input id="fIva" class="amount" inputmode="decimal"></label>
      <label class="field-lbl">Categoría<select id="fCat"></select></label>
      <label class="field-lbl">Forma de pago<select id="fPago">
        <option>Tarjeta</option><option>Efectivo</option><option>Bizum</option><option>Otro</option>
      </select></label>
      <label class="field-lbl">NIF del comercio<input id="fNif" autocomplete="off"></label>
      <label class="field-lbl full">Nota<textarea id="fNota" placeholder="Opcional"></textarea></label>
    </div>
    <div class="actions">
      <button class="btn ghost" id="btnCancelar">Descartar</button>
      <button class="btn" id="btnGuardar">Guardar gasto</button>
    </div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2 id="listTitle">Gastos del mes</h2>
      <button class="btn ghost small hidden" id="btnXlsx">Excel con todo</button>
    </div>
    <div class="cats" id="cats"></div>
    <ul class="gastos" id="lista"></ul>
  </section>

  <p class="foot" id="foot">Los gastos se guardan en este navegador.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
  const CATS=["Supermercado","Restaurantes","Transporte","Hogar","Salud","Ropa","Ocio","Niños","Suministros","Otros"];
  const ITEM_CATS=["Alimentación","Bebidas","Hogar y limpieza","Higiene y cuidado","Salud y farmacia","Infantil","Ropa y calzado","Restauración","Transporte","Ocio","Otros"];
  const TICKET_TO_ITEM={Supermercado:"Alimentación",Restaurantes:"Restauración",Transporte:"Transporte",Hogar:"Hogar y limpieza",Salud:"Salud y farmacia",Ropa:"Ropa y calzado",Ocio:"Ocio","Niños":"Infantil",Suministros:"Otros",Otros:"Otros"};
  const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const $=id=>document.getElementById(id);
  const fmt=n=>(Number(n)||0).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
  const num=v=>{if(v==null||v==="")return 0;if(typeof v==="number")return v;const s=String(v).replace(/[^\d,.\-]/g,"");const t=s.includes(",")?s.replace(/\./g,"").replace(",","."):s;const n=parseFloat(t);return isNaN(n)?0:Math.round(n*100)/100};
  const today=()=>new Date().toISOString().slice(0,10);
  const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  let gastos=[]; let currentLines=[]; let editId=null;
  $("fCat").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
  const mesIn=$("mes"); mesIn.value=today().slice(0,7);
  mesIn.addEventListener("change",render);

  const LKEY="gestor-gastos-data";
  function loadLocal(){try{gastos=JSON.parse(localStorage.getItem(LKEY)||"[]")}catch(e){gastos=[]}}
  function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(gastos))}catch(e){}}

  async function guardar(g){
    g.id="l"+Date.now()+Math.random().toString(36).slice(2,6); gastos.push(g); saveLocal(); render(); return g.id;
  }
  async function actualizar(id,g){
    gastos=gastos.map(x=>x.id===id?{...g,id}:x); saveLocal(); render();
  }

  const SKEY="gestor-gastos-sesion";
  let ses=null; try{ses=JSON.parse(localStorage.getItem(SKEY)||"null")}catch(e){}
  const saveSes=()=>{try{ses?localStorage.setItem(SKEY,JSON.stringify(ses)):localStorage.removeItem(SKEY)}catch(e){}};
  const thumbs={};

  const sesGastos=()=>ses?gastos.filter(g=>g.sesion===ses.id).sort((a,b)=>(a.creado||0)-(b.creado||0)):[];
  function startSes(){if(!ses){ses={id:"s"+Date.now(),inicio:Date.now()};saveSes()}}

  function renderCola(){
    $("sesion").classList.toggle("hidden",!ses);
    if(!ses)return;
    const lista=sesGastos();
    const total=lista.reduce((s,g)=>s+num(g.total),0);
    $("sesInfo").innerHTML=`<strong>${lista.length}</strong> ticket${lista.length===1?"":"s"} guardado${lista.length===1?"":"s"} · total <strong>${fmt(total)}</strong>`;
    $("btnXlsxSes").disabled=!lista.length;
    const rowsG=lista.map(g=>`<li>
        ${thumbs[g.id]?`<img src="${thumbs[g.id]}" alt="">`:`<span class="ph"></span>`}
        <div class="t"><div class="n">${esc(g.comercio)}</div><div class="s">${esc(g.fecha)}</div></div>
        <div class="right"><span class="eur">${fmt(g.total)}</span><button class="btn ghost small" data-rev="${esc(g.id)}">Revisar</button></div></li>`);
    $("cola").innerHTML=rowsG.join("")||`<li style="block;color:var(--muted)">Sube tus tickets para empezar.</li>`;
  }

  $("cola").addEventListener("click",e=>{
    const t=e.target.closest("button"); if(!t)return;
    if(t.dataset.rev){const g=gastos.find(x=>x.id===t.dataset.rev);if(g)openReview(g,thumbs[g.id],g.id);return}
  });

  $("btnCerrarSes").onclick=()=>{
    if(!confirm("¿Cerrar la sesión sin generar el Excel? Los tickets siguen guardados en tu historial."))return;
    ses=null; saveSes(); renderCola(); setStatus("Sesión cerrada.");
  };

  async function borrar(id){
    gastos=gastos.filter(x=>x.id!==id); saveLocal(); render();
  }

  function render(){
    renderCola();
    const mes=mesIn.value;
    const delMes=gastos.filter(g=>(g.fecha||"").startsWith(mes)).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")||(b.creado||0)-(b.creado||0));
    const total=delMes.reduce((s,g)=>s+num(g.total),0);
    $("totalMes").textContent=fmt(total);
    const d=mes?new Date(mes+"-01T12:00:00"):new Date();
    $("listTitle").textContent="Gastos de "+d.toLocaleDateString("es-ES",{month:"long",year:"numeric"});
    $("btnXlsx").classList.toggle("hidden",!gastos.length);

    const porCat={}; delMes.forEach(g=>{porCat[g.categoria||"Otros"]=(porCat[g.categoria||"Otros"]||0)+num(g.total)});
    const max=Math.max(0,...Object.values(porCat));
    $("cats").innerHTML=Object.entries(porCat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>
      `<div class="cat"><span>${esc(c)}</span><span class="bar"><i style="width:${max?Math.max(3,v/max*100):0}%"></i></span><span class="v">${fmt(v)}</span></div>`).join("");

    const ul=$("lista");
    if(!delMes.length){ul.innerHTML=`<li class="empty" style="display:block">Aún no hay gastos este mes. Sube un ticket o escríbelo arriba.</li>`;return}
    ul.innerHTML=delMes.map(g=>{
      const f=new Date((g.fecha||today())+"T12:00:00");
      return `<li>
        <div class="day"><b>${f.getDate()}</b>${f.toLocaleDateString("es-ES",{weekday:"short"})}</div>
        <button class="who" data-edit="${esc(g.id)}"><div class="n">${esc(g.comercio||"Sin nombre")}</div><div class="c">${esc(g.categoria||"Otros")} · ${esc(g.metodo||"")}${num(g.iva)?" · IVA "+fmt(g.iva):""}</div></button>
        <div class="eur">${fmt(g.total)}</div>
        <button class="del" data-id="${esc(g.id)}" aria-label="Borrar gasto">×</button>
      </li>`}).join("");
  }

  $("lista").addEventListener("click",async e=>{
    const ed=e.target.closest("[data-edit]");
    if(ed){const g=gastos.find(x=>x.id===ed.dataset.edit);if(g)openReview(g,thumbs[g.id],g.id);return}
    const b=e.target.closest(".del"); if(!b)return;
    const g=gastos.find(x=>x.id===b.dataset.id);
    if(!confirm(`¿Borrar el gasto de ${g?.comercio||"este ticket"} (${fmt(g?.total)})?`))return;
    await borrar(b.dataset.id);
  });

  function setStatus(msg,err){const s=$("status");s.className="status"+(err?" err":"");s.textContent=msg}
  let pendingThumb=null;

  function openReview(data,imgUrl,id,thumbForNew){
    editId=id||null; pendingThumb=thumbForNew||null;
    $("review").querySelector("h3").textContent=editId?"Editar ticket":"Registrar ticket";
    $("btnGuardar").textContent=editId?"Guardar cambios":"Guardar gasto";
    $("thumb").classList.toggle("hidden",!imgUrl); if(imgUrl)$("thumb").src=imgUrl;
    $("fComercio").value=data.comercio||"";
    $("fFecha").value=/^\d{4}-\d{2}-\d{2}$/.test(data.fecha||"")?data.fecha:today();
    $("fTotal").value=data.total?data.total:"";
    $("fIva").value=data.iva?num(data.iva).toFixed(2).replace(".",","):"";
    $("fCat").value=CATS.includes(data.categoria)?data.categoria:"Otros";
    $("fPago").value=["Tarjeta","Efectivo","Bizum","Otro"].includes(data.metodo)?data.metodo:"Tarjeta";
    $("fNif").value=data.nif||"";
    $("fNota").value=data.nota||"";
    $("review").classList.remove("hidden");
    $("review").scrollIntoView({behavior:"smooth",block:"start"});
    if(!$("fComercio").value) $("fComercio").focus({preventScroll:true});
    else if(!$("fTotal").value) $("fTotal").focus({preventScroll:true});
  }

  function closeReview(){$("review").classList.add("hidden");editId=null;pendingThumb=null}
  $("btnCancelar").onclick=()=>{closeReview();setStatus("")};
  $("btnManual").onclick=()=>openReview({},null);

  $("btnGuardar").onclick=async()=>{
    const total=num($("fTotal").value);
    if(!total){setStatus("Pon el total del ticket para poder guardarlo.",true);$("fTotal").focus();return}
    const g={comercio:$("fComercio").value.trim()||"Sin nombre",fecha:$("fFecha").value\vert{}\vert{}today(),total,iva:num($("fIva").value),
      categoria:$("fCat").value,metodo:$("fPago").value,nif:$("fNif").value.trim(),nota:$("fNota").value.trim(),creado:Date.now()};
    if(ses)g.sesion=ses.id;
    const id=await guardar(g);
    if(pendingThumb)thumbs[id]=pendingThumb;
    setStatus(`Guardado: ${g.comercio}, ${fmt(g.total)}.`);
    closeReview();
    mesIn.value=g.fecha.slice(0,7);
    render();
  };

  $("fileCam").onchange=e=>handleFiles(e.target);
  $("fileUp").onchange=e=>handleFiles(e.target);

  function toDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}

  async function handleFiles(input){
    const files=[...(input.files||[])]; input.value="";
    if(!files.length)return;
    startSes();
    
    for(const f of files){
      const u=await toDataURL(f).catch(()=>null);
      if(!u) continue;
      
      setStatus("⏳ Analizando ticket... (puede tardar unos segundos la primera vez)");
      try {
        // Ejecutar Tesseract OCR
        const result = await window.Tesseract.recognize(u, 'spa');
        const text = result.data.text;
        
        // Extraer lógica básica: primera línea como nombre de comercio
        const lines = text.split('\n').filter(l => l.trim().length > 0);
        let guessedComercio = lines.length > 0 ? lines[0] : "";
        
        // Buscar patrón de precio (ej: 14,50 o 14.50)
        let guessedTotal = "";
        const priceRegex = /\b\d+[,.]\d{2}\b/g;
        const matches = text.match(priceRegex);
        
        if(matches) {
            let maxPrice = 0;
            matches.forEach(m => {
                let val = parseFloat(m.replace(',', '.'));
                if(val > maxPrice && val < 5000) maxPrice = val; // Evitar números gigantes o fechas
            });
            if(maxPrice > 0) guessedTotal = maxPrice.toString().replace('.', ',');
        }
        
        setStatus("✅ Ticket leído. Revisa los datos extraídos.");
        openReview({comercio: guessedComercio, total: guessedTotal}, u, null, u);
        
      } catch(e) {
        console.error("Error OCR:", e);
        setStatus("⚠️ No se pudo extraer el texto automáticamente. Rellena los datos.", true);
        openReview({}, u, null, u);
      }
      break; 
    }
  }

  const EUR='#,##0.00 "€"';
  const serial=f=>{const [y,m,d]=(f||today()).split("-").map(Number);return (Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/86400000};
  const r2=n=>Math.round(n*100)/100;

  function buildWorkbook(datos){
    const X=window.XLSX, wb=X.utils.book_new();
    const cols=[...ITEM_CATS,"Sin desglose"];
    const head=["Fecha","Tienda","Categoría","Forma de pago","Subtotal","IVA","Total"];
    const byMes={}; datos.forEach(g=>{const m=(g.fecha||today()).slice(0,7);(byMes[m]=byMes[m]||[]).push(g)});
    const meses=Object.keys(byMes).sort();
    const nombre=m=>MESES[+m.slice(5,7)-1]+" "+m.slice(0,4);
    const resumen=[["Mes","Subtotal","IVA","Total"]];

    meses.forEach(m=>{
      const lista=byMes[m].sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||""));
      const aoa=[head];
      lista.forEach(g=>{
        const total=num(g.total), iva=num(g.iva);
        aoa.push([serial(g.fecha),g.comercio||"",g.categoria||"",g.metodo||"",r2(total-iva),iva,total]);
      });
      const n=lista.length, last=n+1, totRow=n+2;
      aoa.push([null,"Total del mes",null]);
      const ws=X.utils.aoa_to_sheet(aoa);
      for(let r=1;r<=n;r++){const a=ws[X.utils.encode_cell({r,c:0})];if(a)a.z="dd/mm/yyyy"}
      for(let c=4;c<head.length;c++){
        const L=X.utils.encode_col(c);
        for(let r=1;r<=n;r++){const cell=ws[L+(r+1)];if(cell)cell.z=EUR}
        let s=0; for(let r=1;r<=n;r++)s+=num(aoa[r][c]);
        ws[L+totRow]={t:"n",f:`SUM(${L}2:${L}${last})`,v:r2(s),z:EUR};
      }
      ws["!ref"]=X.utils.encode_range({s:{r:0,c:0},e:{r:totRow-1,c:head.length-1}});
      ws["!cols"]=[{wch:11},{wch:22},{wch:18},{wch:14},{wch:12},{wch:10},{wch:12}];
      const sn=nombre(m);
      X.utils.book_append_sheet(wb,ws,sn);
      resumen.push([sn,{f:`'${sn}'!E${totRow}`,v:0},{f:`'${sn}'!F${totRow}`,v:0},{f:`'${sn}'!G${totRow}`,v:0}]);
    });

    const rs=X.utils.aoa_to_sheet(resumen.map((row,i)=>i?row.map(x=>x&&typeof x==="object"?x.v:x):row));
    resumen.forEach((row,r)=>{if(!r)return;row.forEach((x,c)=>{if(x&&typeof x==="object")rs[X.utils.encode_cell({r,c})]={t:"n",f:x.f,v:x.v,z:EUR}})});
    const rl=resumen.length;
    rs[X.utils.encode_cell({r:rl,c:0})]={t:"s",v:"Total"};
    for(let c=1;c<3;c++){const L=X.utils.encode_col(c);let s=0;for(let r=1;r<rl;r++)s+=num(resumen[r][c]?.v);rs[L+(rl+1)]={t:"n",f:`SUM(${L}2:${L}${rl})`,v:r2(s),z:EUR}}
    rs["!ref"]=X.utils.encode_range({s:{r:0,c:0},e:{r:rl,c:resumen[0].length-1}});
    rs["!cols"]=[{wch:16},{wch:13},{wch:13},{wch:13}];
    X.utils.book_append_sheet(wb,rs,"Resumen");
    wb.SheetNames=["Resumen",...wb.SheetNames.filter(s=>s!=="Resumen")];
    return X.write(wb,{bookType:"xlsx",type:"array"});
  }

  async function exportar(datos,nombre){
    if(!window.XLSX){setStatus("No se pudo preparar el Excel.",true);return false}
    try{
      const wbout = buildWorkbook(datos);
      const blob = new Blob([wbout], {type:"application/octet-stream"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = nombre;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      return true;
    }catch(e){console.error(e);setStatus("No se pudo crear el Excel.",true);return false}
  }

  $("btnXlsx").onclick=async()=>{if(await exportar(gastos,`gestor-gastos-${today()}.xlsx`))setStatus("Excel descargado con todos tus tickets.")};
  $("btnXlsxSes").onclick=async()=>{
    const lista=sesGastos(); if(!lista.length)return;
    if(await exportar(lista,`tickets-sesion-${today()}.xlsx`)){
      ses=null; saveSes(); renderCola();
      setStatus(`Excel generado con ${lista.length} ticket${lista.length===1?"":"s"}. Sesión cerrada.`);
    }
  };

  loadLocal();
  render();
})();
</script>
